name: Deploy OTA Update (Capgo)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/vite.config.ts'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de distribución en Capgo'
        required: true
        default: 'production'
        type: string

jobs:
  ota-update:
    name: Publicar Actualización OTA en Capgo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: 🔨 Compilar aplicación React (Vite)
        working-directory: frontend
        run: npm run build

      - name: 🚀 Subir Bundle a Capgo (OTA)
        working-directory: frontend
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "❌ Error: El secret CAPGO_TOKEN no está configurado en el repositorio de GitHub."
            echo "Ve a Configuración de tu repositorio > Secrets and variables > Actions y agrega CAPGO_TOKEN."
            exit 1
          fi
          
          CHANNEL="${{ inputs.channel || 'production' }}"
          echo "Publicando actualización en el canal: $CHANNEL..."
          npx @capgo/cli bundle upload \
            --apikey "$CAPGO_TOKEN" \
            --channel "$CHANNEL" \
            --path dist
