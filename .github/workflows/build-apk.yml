name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias web
        working-directory: frontend
        run: npm ci

      - name: 🔨 Compilar aplicación React (Vite)
        working-directory: frontend
        run: npm run build

      - name: 🔄 Sincronizar Capacitor con Android
        working-directory: frontend
        run: npx cap sync android

      - name: 🔍 Comprobar configuración de firma
        id: check-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE_INPUT: ${{ inputs.build_type }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ "$BUILD_TYPE_INPUT" != "debug" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "apk_mode=release" >> "$GITHUB_OUTPUT"
            echo "✅ Configuración de firma completa detectada. Se compilará Release firmado."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "apk_mode=debug" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Configuración de firma no configurada o modo debug solicitado. Se compilará Debug instalable."
          fi

      - name: 🔐 Preparar Keystore de Producción
        if: steps.check-signing.outputs.has_signing == 'true'
        working-directory: frontend/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Decodificando Keystore de producción..."
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: ⚙️ Dar permisos de ejecución a Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: 🚀 Compilar APK Release Firmado
        if: steps.check-signing.outputs.has_signing == 'true'
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 🚀 Compilar APK Debug Instalable
        if: steps.check-signing.outputs.has_signing != 'true'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Identificar archivo APK generado
        id: apk-finder
        run: |
          APK_PATH=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          echo "APK encontrado en: $APK_PATH ($APK_NAME)"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: 📤 Subir APK como Artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: InvenEasy-${{ steps.check-signing.outputs.apk_mode == 'release' && 'Release' || 'Debug' }}-APK
          path: ${{ steps.apk-finder.outputs.apk_path }}
          retention-days: 30
