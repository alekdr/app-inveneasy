name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias web
        working-directory: frontend
        run: npm ci

      - name: 🔨 Compilar aplicación React (Vite)
        working-directory: frontend
        run: npm run build

      - name: 🔄 Sincronizar Capacitor con Android
        working-directory: frontend
        run: npx cap sync android

      - name: 🔐 Preparar Keystore de Producción (si existe secret)
        working-directory: frontend/android/app
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Decodificando Keystore de producción..."
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: ⚙️ Dar permisos de ejecución a Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: 🚀 Compilar APK con Gradle (Release)
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: 📦 Identificar archivo APK generado
        id: apk-finder
        run: |
          APK_PATH=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK encontrado en: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Subir APK como Artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: InvenEasy-${{ inputs.build_type || 'release' }}-APK
          path: ${{ steps.apk-finder.outputs.apk_path }}
          retention-days: 30
